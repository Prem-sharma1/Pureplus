<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#E8F1EC"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F3D2E" flood-opacity="0.12"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="135"/>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <rect width="596" height="596" x="2" y="2" rx="30" fill="none" stroke="#0F3D2E" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Left Content Column -->
  <g transform="translate(45, 55)">
    <!-- Top Category Pill -->
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#0F3D2E" fill-opacity="0.08"/>
    <text x="14" y="18" font-family="'Times New Roman', Georgia, serif" font-size="11" font-weight="700" fill="#0F3D2E" letter-spacing="1">AUTHENTIC PROCESS</text>

    <!-- Main Headline -->
    <text x="0" y="85" font-family="'Times New Roman', Georgia, serif" font-size="42" font-weight="900" fill="#0F3D2E" letter-spacing="-1">SMALL BATCH</text>
    <text x="0" y="138" font-family="'Times New Roman', Georgia, serif" font-size="42" font-weight="900" fill="#0F3D2E" letter-spacing="-1">BLENDING</text>

    <!-- Golden Accent Line -->
    <line x1="0" y1="168" x2="220" y2="168" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Key Benefit 1 -->
    <g transform="translate(0, 205)">
      <circle cx="12" cy="12" r="11" fill="#0F3D2E" fill-opacity="0.1"/>
      <path d="M7 12l3.5 3.5 6.5-6.5" stroke="#0F3D2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F3D2E">Controlled Batch Quality</text>
    </g>

    <!-- Key Benefit 2 -->
    <g transform="translate(0, 248)">
      <circle cx="12" cy="12" r="11" fill="#0F3D2E" fill-opacity="0.1"/>
      <path d="M7 12l3.5 3.5 6.5-6.5" stroke="#0F3D2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F3D2E">Potent Botanical Blends</text>
    </g>

    <!-- Key Benefit 3 -->
    <g transform="translate(0, 291)">
      <circle cx="12" cy="12" r="11" fill="#0F3D2E" fill-opacity="0.1"/>
      <path d="M7 12l3.5 3.5 6.5-6.5" stroke="#0F3D2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F3D2E">Fresh &amp; Active Ingredients</text>
    </g>
  </g>

  <!-- Right Image Photo Frame -->
  <g transform="translate(275, 75)" filter="url(#shadowFilter)">
    <circle cx="150" cy="150" r="140" fill="#FFFFFF"/>
    <circle cx="150" cy="150" r="135" fill="#E8F1EC"/>
    <image href="/HeaderImage/header3.jpeg" x="15" y="15" width="270" height="270" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Bottom Quality Assurance Row -->
  <g transform="translate(45, 465)">
    <rect x="0" y="0" width="510" height="80" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#0F3D2E" stroke-opacity="0.08"/>

    <!-- Icon 1 -->
    <g transform="translate(25, 24)">
      <circle cx="16" cy="16" r="14" fill="#E8F5E9"/>
      <path d="M11 16l3.5 3.5 6.5-6.5" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
      <text x="40" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0F3D2E" letter-spacing="0.5">100% PURE</text>
    </g>

    <!-- Icon 2 -->
    <g transform="translate(195, 24)">
      <circle cx="16" cy="16" r="14" fill="#E8F5E9"/>
      <path d="M11 16l3.5 3.5 6.5-6.5" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
      <text x="40" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0F3D2E" letter-spacing="0.5">QUALITY TESTED</text>
    </g>

    <!-- Icon 3 -->
    <g transform="translate(370, 24)">
      <circle cx="16" cy="16" r="14" fill="#E8F5E9"/>
      <path d="M11 16l3.5 3.5 6.5-6.5" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
      <text x="40" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0F3D2E" letter-spacing="0.5">HANDCRAFTED</text>
    </g>
  </g>
</svg>
